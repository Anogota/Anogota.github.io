---
layout: default
---
{% if page.title %}
<header class="post-header">
  <div class="post-date">{{ page.date | date: "%b %d, %Y" }}</div>
  <h1 class="post-h1">{{ page.title }}</h1>
  {% if page.tags and page.tags.size > 0 %}
  <div class="post-tags">
    <span class="tag-ico">&#127991;</span>
    {% for t in page.tags %}<a class="post-tag" href="{{ '/tags/' | relative_url }}#tag-{{ t | slugify }}">{{ t }}</a>{% endfor %}
  </div>
  {% endif %}
</header>
{% endif %}
{{ content }}
